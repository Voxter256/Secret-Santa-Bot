[project]
name = "secret-santa-telegram-bot"
version = "0.1.0"
description = "Telegram Secret Santa Exchange Bot"
requires-python = ">=3.10"
dependencies = [
    "python-telegram-bot>=22.0",
    "sqlalchemy>=2.0",
    "mysql-connector-python>=8.0.21",
    "alembic>=1.16.5",
]

[dependency-groups]
dev = [
    "babel>=2.17.0",
    "mypy>=1.19.1",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "ruff>=0.17.6",
]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# alembic's env.py must mutate sys.path before importing the app models.
"alembic/env.py" = ["E402"]

[tool.ruff.lint.isort]
# The local alembic/ migrations directory must not flip this classification
# depending on the ruff version's src detection heuristics.
known-first-party = ["bot"]
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
enable_error_code = ["ignore-without-code"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
