services:
  bot:
    build:
      context: .
    volumes:
      - .:/usr/src/app
    environment:
      TZ: "America/New_York"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      DATABASE_URL: "${DATABASE_URL:-sqlite:///bot.sqlite}"
      MESSAGE_MAX_AGE_SECONDS: "${MESSAGE_MAX_AGE_SECONDS:-60}"
      FEEDBACK_CHAT_ID: "${FEEDBACK_CHAT_ID:-}"